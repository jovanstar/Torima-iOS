name: Build Torima iOS

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run transport security tests on an iPhone simulator
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: torima-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the build file
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore the complete Torima source project
        run: |
          python3 - <<'PY'
          import base64, json, math, struct, zlib
          from pathlib import Path, PurePosixPath
          begin = '# TORIMA_SOURCE_' + 'BEGIN'
          end = '# TORIMA_SOURCE_' + 'END'
          workflow = Path('.github/workflows/torima-ios.yml').read_text(encoding='utf-8')
          if workflow.count(begin) != 1 or workflow.count(end) != 1:
              raise SystemExit('Source markers missing; keep the full workflow including its final comment block')
          section = workflow.split(begin, 1)[1].split(end, 1)[0]
          encoded = ''.join(line[2:].strip() for line in section.splitlines() if line.startswith('# '))
          sources = json.loads(base64.b64decode(encoded, validate=True))
          root = Path('generated-torima').resolve()
          if root.exists():
              raise SystemExit('generated-torima already exists; use a clean checkout')
          if not isinstance(sources, dict) or len(sources) > 200:
              raise SystemExit('Invalid source package')
          for name, content in sources.items():
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or '\\' in name or not isinstance(content, str):
                  raise SystemExit('Invalid source path')
              target = root.joinpath(*path.parts)
              if root not in target.resolve().parents:
                  raise SystemExit('Source path escaped project')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          # Generate an opaque 1024px app icon using only Python's standard library.
          size = 1024
          raw = bytearray()
          for y in range(size):
              raw.append(0)
              for x in range(size):
                  radius = math.hypot(x - 512, y - 512)
                  angle = math.atan2(y - 512, x - 512)
                  ring = 334 < radius < 348 and not -0.32 < angle < 0.24
                  inner = 292 < radius < 295
                  letter = (328 <= x <= 696 and 305 <= y <= 382) or (473 <= x <= 551 and 382 <= y <= 714)
                  glow = max(0, 1 - radius / 640)
                  raw.extend((100, 240, 220) if ring or letter else
                             (8 + round(glow * 10), 80 if inner else 15 + round(glow * 25),
                              83 if inner else 28 + round(glow * 27)))
          def chunk(kind, data):
              return struct.pack('!I', len(data)) + kind + data + struct.pack('!I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('!2I5B', size, size, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
          (root / 'Torima/Assets.xcassets/AppIcon.appiconset/Torima.png').write_bytes(png)
          for path in (root / 'Server').glob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('Restored', len(sources), 'text files and the generated icon.')
          PY
          mkdir -p logs

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Build native iPhone app
        working-directory: generated-torima
        run: |
          xcodebuild \
            -project Torima.xcodeproj \
            -scheme Torima \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee ../logs/device-build.log

      - name: Test transport security on an iPhone simulator
        if: inputs.run_tests
        run: |
          xcrun simctl list devices available --json > simulators.json
          simulator_id=$(python3 - <<'PY'
          import json, re
          from pathlib import Path
          devices = json.loads(Path('simulators.json').read_text())['devices']
          phones = [d for runtime, items in sorted(devices.items(), reverse=True)
                    if 'iOS' in runtime for d in items if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator on this runner')
          device = phones[0]['udid']
          if not re.fullmatch(r'[0-9A-Fa-f-]{36}', device):
              raise SystemExit('Invalid simulator ID')
          print(device)
          PY
          )
          cd generated-torima
          xcodebuild \
            -project Torima.xcodeproj \
            -scheme Torima \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee ../logs/simulator-tests.log

      - name: Package the IPA and server update
        run: |
          python3 - <<'PY'
          import plistlib, shutil, zipfile
          from pathlib import Path
          root = Path('generated-torima').resolve()
          app = root / 'build/Build/Products/Release-iphoneos/Torima.app'
          if not app.is_dir():
              raise SystemExit('No device app bundle produced')
          with (app / 'Info.plist').open('rb') as stream:
              info = plistlib.load(stream)
          if info.get('CFBundleIdentifier') != 'com.jovanstar.torima' or info.get('DTPlatformName') != 'iphoneos':
              raise SystemExit('Unexpected app identity or simulator bundle')
          if not (app / info['CFBundleExecutable']).is_file():
              raise SystemExit('Compiled app executable missing')
          dist = Path('dist')
          payload = dist / 'Payload'
          payload.mkdir(parents=True, exist_ok=True)
          shutil.copytree(app, payload / 'Torima.app')
          with zipfile.ZipFile(dist / 'Torima-Unsigned.ipa', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(payload.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist).as_posix())
          with zipfile.ZipFile(dist / 'Torima-iOS-Source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  relative = path.relative_to(root)
                  if path.is_file() and not any(p.startswith('build') or p == 'logs' or p.endswith('.xcresult') for p in relative.parts):
                      archive.write(path, 'Torima-iOS/' + relative.as_posix())
          with zipfile.ZipFile(dist / 'Torima-iOS-Server.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted((root / 'Server').rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root / 'Server').as_posix())
          shutil.copy2(root / 'INSTALL-WINDOWS.md', dist / 'INSTALL-WINDOWS.md')
          with zipfile.ZipFile(dist / 'Torima-Unsigned.ipa') as archive:
              if archive.testzip() is not None or 'Payload/Torima.app/Info.plist' not in archive.namelist():
                  raise SystemExit('IPA integrity check failed')
          shutil.rmtree(payload)
          print('Packaged unsigned native IPA, source archive, server update and installation guide.')
          PY

      - name: Upload iPhone installation package
        uses: actions/upload-artifact@v4
        with:
          name: Torima-for-AltStore
          path: |
            dist/Torima-Unsigned.ipa
            dist/Torima-iOS-Source.zip
            dist/Torima-iOS-Server.zip
            dist/INSTALL-WINDOWS.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Torima-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Installation summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Torima native iPhone app
          Download **Torima-for-AltStore** from this run's Artifacts section and extract it.
          Sign/install **Torima-Unsigned.ipa** with AltStore using your Windows PC.
          Read **INSTALL-WINDOWS.md** for phone and Pterodactyl instructions.
          This is the basic native build. Native push needs separate Apple Developer/APNs setup.
